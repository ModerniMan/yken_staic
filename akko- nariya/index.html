<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="0; url=../akko-nahariya/">
    <title>מחולל ידידים | הפנייה סניף עכו-נהריה</title>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #080c10;
            --accent-blue: #42a5f5;
            --accent-purple: #ab47bc;
            --text-main: #f0f4f8;
            --text-sub: #8899aa;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Heebo', sans-serif;
            background: var(--bg-main);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* Ambient glow background */
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                radial-gradient(circle at 50% 50%, rgba(66, 165, 245, 0.1) 0%, transparent 60%),
                radial-gradient(circle at 40% 60%, rgba(171, 71, 188, 0.08) 0%, transparent 50%);
            z-index: 0;
        }

        .redirect-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 24px;
            padding: 40px 30px;
            text-align: center;
            max-width: 450px;
            width: 90%;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
            z-index: 1;
            position: relative;
        }

        .spinner {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(66, 165, 245, 0.1);
            border-left-color: var(--accent-blue);
            border-right-color: var(--accent-purple);
            border-radius: 50%;
            margin: 0 auto 24px;
            animation: spin 1.2s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        h2 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 12px;
            background: linear-gradient(135deg, #fff, #bcd);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        p {
            color: var(--text-sub);
            font-size: 1rem;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .btn {
            display: inline-block;
            background: linear-gradient(135deg, var(--accent-blue), #1565c0);
            color: #fff;
            text-decoration: none;
            padding: 10px 24px;
            border-radius: 12px;
            font-weight: 600;
            transition: all 0.3s;
            box-shadow: 0 4px 16px rgba(66, 165, 245, 0.3);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(66, 165, 245, 0.4);
        }
    </style>
    <script>
        // Force redirect immediately
        window.location.replace("../akko-nahariya/");
    </script>
</head>
<body>
    <div class="redirect-card">
        <div class="spinner"></div>
        <h2>הפנייה לכתובת התקינה</h2>
        <p>שם התיקייה של סניף עכו-נהריה תוקן לכתובת תקנית. אנו מעבירים אותך כעת...</p>
        <a href="../akko-nahariya/" class="btn">לחץ כאן אם אינך מועבר</a>
    </div>
</body>
</html>
