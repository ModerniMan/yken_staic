<!DOCTYPE html>
<html lang="he" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>מחולל ידידים | בחירת סניף</title>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg-main: #0f1923;
            --bg-card: rgba(255, 255, 255, 0.06);
            --bg-card-hover: rgba(255, 255, 255, 0.12);
            --border-card: rgba(255, 255, 255, 0.08);
            --border-hover: rgba(255, 255, 255, 0.2);
            --text-main: #f0f4f8;
            --text-sub: #8899aa;
            --text-detail: #5a6a7a;
            --accent-blue: #42a5f5;
            --accent-green: #66bb6a;
            --accent-orange: #ffa726;
            --accent-red: #ef5350;
            --accent-purple: #ab47bc;
            --glow-blue: rgba(66, 165, 245, 0.15);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Heebo', sans-serif;
            background: var(--bg-main);
            color: var(--text-main);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Animated background */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background:
                radial-gradient(ellipse at 20% 50%, rgba(66, 165, 245, 0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 20%, rgba(171, 71, 188, 0.06) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 80%, rgba(102, 187, 106, 0.05) 0%, transparent 50%);
            z-index: 0;
            pointer-events: none;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 40px 24px 60px;
            position: relative;
            z-index: 1;
        }

        /* Header */
        .header {
            text-align: center;
            margin-bottom: 50px;
        }

        .header-logo {
            width: 80px;
            height: 80px;
            margin: 0 auto 20px;
            background: linear-gradient(135deg, var(--accent-blue), #1565c0);
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            box-shadow: 0 8px 32px rgba(66, 165, 245, 0.3);
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-6px);
            }
        }

        .header h1 {
            font-size: 2.2rem;
            font-weight: 800;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #fff, #bcd);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header p {
            color: var(--text-sub);
            font-size: 1.1rem;
            font-weight: 300;
        }

        /* Section titles */
        .section-title {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
            margin-top: 10px;
        }

        .section-title h2 {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--text-main);
        }

        .section-title .badge {
            background: rgba(66, 165, 245, 0.15);
            color: var(--accent-blue);
            padding: 3px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .section-title::after {
            content: '';
            flex: 1;
            height: 1px;
            background: linear-gradient(to left, transparent, var(--border-card));
        }

        /* Branch Grid */
        .branch-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .branch-card {
            background: var(--bg-card);
            border: 1px solid var(--border-card);
            border-radius: 16px;
            padding: 24px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
            gap: 14px;
            position: relative;
            overflow: hidden;
        }

        .branch-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            border-radius: 16px 16px 0 0;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .branch-card:hover {
            background: var(--bg-card-hover);
            border-color: var(--border-hover);
            transform: translateY(-4px);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.3);
        }

        .branch-card:hover::before {
            opacity: 1;
        }

        .branch-card.color-blue::before {
            background: linear-gradient(90deg, var(--accent-blue), #1e88e5);
        }

        .branch-card.color-green::before {
            background: linear-gradient(90deg, var(--accent-green), #43a047);
        }

        .branch-card.color-orange::before {
            background: linear-gradient(90deg, var(--accent-orange), #fb8c00);
        }

        .branch-card.color-red::before {
            background: linear-gradient(90deg, var(--accent-red), #e53935);
        }

        .branch-card.color-purple::before {
            background: linear-gradient(90deg, var(--accent-purple), #8e24aa);
        }

        .card-top {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .card-icon {
            width: 50px;
            height: 50px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            flex-shrink: 0;
        }

        .color-blue .card-icon {
            background: rgba(66, 165, 245, 0.15);
        }

        .color-green .card-icon {
            background: rgba(102, 187, 106, 0.15);
        }

        .color-orange .card-icon {
            background: rgba(255, 167, 38, 0.15);
        }

        .color-red .card-icon {
            background: rgba(239, 83, 80, 0.15);
        }

        .color-purple .card-icon {
            background: rgba(171, 71, 188, 0.15);
        }

        .card-info h3 {
            font-size: 1.15rem;
            font-weight: 700;
            margin-bottom: 2px;
        }

        .card-info span {
            font-size: 0.85rem;
            color: var(--text-sub);
        }

        .card-arrow {
            margin-right: auto;
            font-size: 1.2rem;
            color: var(--text-detail);
            transition: all 0.3s;
        }

        .branch-card:hover .card-arrow {
            color: var(--text-sub);
            transform: translateX(-4px);
        }

        .card-meta {
            display: flex;
            gap: 16px;
            font-size: 0.8rem;
            color: var(--text-detail);
        }

        .card-meta span {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* Template Card - dashed */
        .branch-card.template-card {
            border-style: dashed;
            border-color: rgba(255, 255, 255, 0.12);
            background: transparent;
        }

        .branch-card.template-card:hover {
            border-color: var(--accent-purple);
            background: rgba(171, 71, 188, 0.05);
        }

        .branch-card.template-card .card-icon {
            background: rgba(171, 71, 188, 0.1);
            border: 1px dashed rgba(171, 71, 188, 0.3);
        }

        /* Footer */
        .footer {
            text-align: center;
            color: var(--text-detail);
            font-size: 0.85rem;
            margin-top: 50px;
            padding-top: 20px;
            border-top: 1px solid var(--border-card);
        }

        .footer a {
            color: var(--accent-blue);
            text-decoration: none;
        }

        /* How-to section */
        .how-to {
            background: rgba(66, 165, 245, 0.05);
            border: 1px solid rgba(66, 165, 245, 0.1);
            border-radius: 14px;
            padding: 20px 24px;
            margin-top: 10px;
            font-size: 0.9rem;
            color: var(--text-sub);
            line-height: 1.8;
        }

        .how-to strong {
            color: var(--text-main);
        }

        .how-to code {
            background: rgba(255, 255, 255, 0.08);
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-family: 'Courier New', monospace;
            direction: ltr;
            display: inline-block;
        }

        /* Responsive */
        @media (max-width: 640px) {
            .container {
                padding: 24px 16px 40px;
            }

            .header h1 {
                font-size: 1.7rem;
            }

            .branch-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="header-logo">🛡️</div>
            <h1>מחולל ידידים</h1>
            <p>בחר סניף כדי להיכנס למערכת העיצוב</p>
        </div>

        <!-- Active Branches -->
        <div class="section-title">
            <h2>🏢 סניפים פעילים</h2>
            <span class="badge" id="branch-count">2 סניפים</span>
        </div>

        <div class="branch-grid" id="branches-grid">
            <!-- Branch cards injected by JS -->
        </div>



        <!-- Footer -->
        <div class="footer">
            מחולל דוחות ידידים &copy; 2026 &nbsp;|&nbsp; פיתוח ועיצוב: ליפז &nbsp;|&nbsp; לע"נ ניב בן שרון ✨
        </div>
    </div>

    <script>
        // ======================================================
        //   🔧 הגדרת סניפים - הוסף סניפים חדשים כאן!
        // ======================================================
        const branches = [
            {
                name: "סניף קריות",
                nickname: "אלופי הקריות",
                folder: "krayot",
                icon: "🏙️",
                color: "blue",      // blue / green / orange / red / purple
                systems: ["דוח שבועי", "קבלת פנים"]
            },
            {
                name: "סניף עכו - נהריה",
                nickname: "עכו נהריה",
                folder: "akko- nariya",
                icon: "🌊",
                color: "green",
                systems: ["דוח שבועי", "קבלת פנים"]
            },
            {
                name: "סניף עתלית טירת כרמל",
                nickname: "עתלית-טירה",
                folder: "atlit",
                icon: "⛰️",
                color: "orange",
                systems: ["דוח שבועי", "קבלת פנים"]
            },
            // ──────────────────────────────────────────────
            //   ➕ הוסף סניפים נוספים כאן, לדוגמה:
            // ──────────────────────────────────────────────
            // {
            //     name: "סניף חיפה",
            //     nickname: "גיבורי הכרמל",
            //     folder: "haifa",
            //     icon: "⛰️",
            //     color: "orange",
            //     systems: ["דוח שבועי", "קבלת פנים"]
            // },
        ];

        // ======================================================
        //   Render branch cards
        // ======================================================
        function renderBranches() {
            const grid = document.getElementById('branches-grid');
            const countEl = document.getElementById('branch-count');
            grid.innerHTML = '';

            branches.forEach(branch => {
                const card = document.createElement('a');
                card.href = branch.folder + '/';
                card.className = `branch-card color-${branch.color}`;

                const systemTags = branch.systems.map(s => `<span>✅ ${s}</span>`).join('');

                card.innerHTML = `
                    <div class="card-top">
                        <div class="card-icon">${branch.icon}</div>
                        <div class="card-info">
                            <h3>${branch.name}</h3>
                            <span>${branch.nickname}</span>
                        </div>
                        <div class="card-arrow">←</div>
                    </div>
                    <div class="card-meta">
                        ${systemTags}
                    </div>
                `;

                grid.appendChild(card);
            });

            const count = branches.length;
            countEl.textContent = count === 1 ? 'סניף אחד' : `${count} סניפים`;
        }

        renderBranches();
    </script>
</body>

</html>
