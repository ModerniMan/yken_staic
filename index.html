<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>לזכרו של ניב בן שרון ז"ל</title>
    <meta name="description" content="דף זיכרון לניב בן שרון ז&quot;ל. מחולל הדוחות של ידידים פעל לעילוי נשמתו.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@300;500;700&family=Heebo:wght@300;400&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg1: #0b0f1a;
            --bg2: #141b2d;
            --gold: #e8c77a;
            --gold-soft: rgba(232, 199, 122, 0.25);
            --text: #e9e6df;
            --muted: #a7a39a;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; }
        body {
            font-family: 'Heebo', sans-serif;
            color: var(--text);
            background: radial-gradient(ellipse at top, var(--bg2) 0%, var(--bg1) 70%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            padding: 24px;
        }
        .stars { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
        .star {
            position: absolute; width: 2px; height: 2px; border-radius: 50%;
            background: #fff; opacity: 0; animation: twinkle 6s infinite ease-in-out;
        }
        @keyframes twinkle { 0%,100% { opacity: 0; } 50% { opacity: .7; } }

        main {
            position: relative; z-index: 1;
            max-width: 560px; width: 100%;
            text-align: center;
            padding: 56px 32px 40px;
            border-radius: 24px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(232, 199, 122, 0.15);
            backdrop-filter: blur(8px);
            box-shadow: 0 30px 80px rgba(0,0,0,.5);
            animation: fadeUp 1.8s ease-out both;
        }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: none; } }

        /* Candle */
        .candle-wrap { height: 170px; display: flex; justify-content: center; align-items: flex-end; margin-bottom: 28px; }
        .candle { position: relative; width: 34px; height: 100px;
            background: linear-gradient(90deg, #d9d2c3, #f7f3ea 45%, #cfc7b6);
            border-radius: 6px 6px 4px 4px; box-shadow: 0 0 40px var(--gold-soft); }
        .wick { position: absolute; top: -10px; left: 50%; width: 2px; height: 12px; background: #2b2b2b; transform: translateX(-50%); }
        .flame {
            position: absolute; top: -52px; left: 50%; width: 18px; height: 44px;
            transform: translateX(-50%); transform-origin: 50% 90%;
            background: radial-gradient(ellipse at 50% 75%, #fff 0%, #ffe9a8 25%, #ffb347 55%, rgba(255,120,0,0) 75%);
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            filter: blur(.4px);
            animation: flicker 2.4s infinite ease-in-out;
        }
        .glow {
            position: absolute; top: -90px; left: 50%; width: 160px; height: 160px; transform: translateX(-50%);
            background: radial-gradient(circle, rgba(255,200,110,.28) 0%, rgba(255,200,110,0) 65%);
            animation: glow 3s infinite ease-in-out; pointer-events: none;
        }
        @keyframes flicker {
            0%,100% { transform: translateX(-50%) scale(1) rotate(-1deg); }
            25% { transform: translateX(-52%) scale(1.04, .96) rotate(2deg); }
            50% { transform: translateX(-49%) scale(.97, 1.05) rotate(-2deg); }
            75% { transform: translateX(-51%) scale(1.02, .98) rotate(1deg); }
        }
        @keyframes glow { 0%,100% { opacity: .85; } 50% { opacity: 1; } }

        .label { font-size: 14px; letter-spacing: 3px; color: var(--muted); margin-bottom: 12px; }
        h1 {
            font-family: 'Frank Ruhl Libre', serif; font-weight: 700;
            font-size: clamp(36px, 8vw, 52px);
            background: linear-gradient(180deg, #fff3d1, var(--gold));
            -webkit-background-clip: text; background-clip: text; color: transparent;
            margin-bottom: 6px;
        }
        .zal { font-family: 'Frank Ruhl Libre', serif; font-size: 22px; color: var(--gold); margin-bottom: 28px; }
        .divider { width: 80px; height: 1px; margin: 0 auto 28px;
            background: linear-gradient(90deg, transparent, var(--gold), transparent); }
        p { font-weight: 300; line-height: 1.9; font-size: 17px; color: var(--text); margin-bottom: 18px; }
        .verse { font-family: 'Frank Ruhl Libre', serif; font-size: 20px; color: var(--gold); margin: 30px 0 8px; }
        .tnzbh { font-family: 'Frank Ruhl Libre', serif; font-size: 26px; letter-spacing: 6px; color: var(--gold); margin-top: 8px; }
        footer { margin-top: 36px; font-size: 13px; color: var(--muted); }
        @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    </style>
</head>
<body>
    <div class="stars" id="stars" aria-hidden="true"></div>

    <main>
        <div class="candle-wrap" aria-hidden="true">
            <div class="candle">
                <div class="glow"></div>
                <div class="wick"></div>
                <div class="flame"></div>
            </div>
        </div>

        <div class="label">לזכרו של</div>
        <h1>ניב בן שרון</h1>
        <div class="zal">ז״ל</div>
        <div class="divider"></div>

        <p>מחולל הדוחות של ידידים פעל לעילוי נשמתו של ניב.</p>
        <p>הארגון החליט לסגור את המערכת.<br>
           הדף הזה נשאר כדי שנזכור את ניב.</p>
        <p>תודה לכל הכוננים שהשתמשו במערכת והמשיכו לעזור לאנשים בדרכים.</p>

        <div class="verse">״נֵר ה׳ נִשְׁמַת אָדָם״</div>
        <div class="tnzbh">ת.נ.צ.ב.ה</div>

        <footer>פיתוח ועיצוב: ליפז</footer>
    </main>

    <script>
        const s = document.getElementById('stars');
        for (let i = 0; i < 70; i++) {
            const d = document.createElement('div');
            d.className = 'star';
            d.style.top = Math.random() * 100 + '%';
            d.style.left = Math.random() * 100 + '%';
            d.style.animationDelay = (Math.random() * 6) + 's';
            s.appendChild(d);
        }
    </script>
</body>
</html>
